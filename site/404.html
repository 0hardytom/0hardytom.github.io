<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Under Maintenance | Tom Hardy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #111 url("/maintenance-landscape.jpg") center / cover no-repeat;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-family: "Archivo Black", "Arial Black", sans-serif;
      }
      h1 {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 20vh 16px 8vh;
        background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.75));
        color: rgba(255, 255, 255, 0.35);
        -webkit-text-stroke: max(2px, 0.02em) #fff;
        /* "MAINTENANCE" is ~8.3em wide in Archivo Black; fit it to the screen */
        font-size: min(calc((100vw - 32px) / 8.6), 20vh);
        line-height: 1;
        font-weight: 400;
        text-align: center;
        text-transform: uppercase;
      }
      @media (orientation: portrait) {
        body {
          background-image: url("/maintenance-portrait.jpg");
        }
      }
    </style>
  </head>
  <body>
    <h1>Under<br>Maintenance</h1>
  </body>
</html>
